name: validate project data

on:
  push:
    paths:
      - progress.yaml
      - verification.yaml
      - experiments/**
      - lab/**
      - scripts/validate_progress.py
      - scripts/validate_verification.py
      - scripts/validate_experiments.py
      - scripts/validate_lab_cases.py
      - .github/workflows/validate-progress.yml
  pull_request:
    paths:
      - progress.yaml
      - verification.yaml
      - experiments/**
      - lab/**
      - scripts/validate_progress.py
      - scripts/validate_verification.py
      - scripts/validate_experiments.py
      - scripts/validate_lab_cases.py
      - .github/workflows/validate-progress.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate progress.yaml
        run: python scripts/validate_progress.py

      - name: Validate verification.yaml
        run: python scripts/validate_verification.py

      - name: Validate experiment records
        run: python scripts/validate_experiments.py

      - name: Validate field-lab cases
        run: python scripts/validate_lab_cases.py
