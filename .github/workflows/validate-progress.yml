name: validate progress data

on:
  push:
    paths:
      - progress.yaml
      - scripts/validate_progress.py
      - .github/workflows/validate-progress.yml
  pull_request:
    paths:
      - progress.yaml
      - scripts/validate_progress.py
      - .github/workflows/validate-progress.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate progress.yaml
        run: python scripts/validate_progress.py
