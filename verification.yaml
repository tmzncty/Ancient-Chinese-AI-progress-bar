    paper: public
    code: unknown
    data: partial
    model: not_applicable
    evaluation: author_reported_and_live_feature
    reproduction: not_attempted
    checked:
      - "Peer-reviewed publication exists"
    not_checked:
      - "Original experiment reproduction"

